let idx=0,variation=0,payment='cash',petName='';const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function ability(p){return p.sniff&&p.attack?'This pet can sniff and attack.':p.sniff?'This pet can sniff.':p.attack?'This pet can attack.':'This pet cannot sniff or attack.'}function thumb(p){return `<div class="missing">${esc(p.label)}</div>`}function render(){const p=pets[idx];variation=Math.min(variation,p.variations-1);app.innerHTML=`<div class="shopContainer"><div class="stagePet"><div class="ghost">🐾</div></div><div class="stageNote">THE LIVE FIVEM SHOP RENDERS THE 3D PED HERE</div><div class="petsContainer"><div class="petShopItems">${pets.map((x,i)=>`<div class="petSmallItem" data-i="${i}" style="background-color:${i===idx?'var(--bg3)':''}">${thumb(x)}</div>`).join('')}</div></div><div class="infoContainer"><div class="petIconContainer">${thumb(p)}<div class="petShopName">${esc(p.label)}</div></div><p class="petDescription">${esc(p.desc)}<br><br>${ability(p)}</p><div class="variationContainer"><div class="variationLabel">Variation</div><div class="variation" id="prev">‹</div><div class="variationNumber">${variation}</div><div class="variation" id="next">›</div></div><div class="purchase" id="purchase">Purchase (${p.price} €)</div></div><div class="rotate" id="rotate"><svg class="rotateIcon" viewBox="0 0 120 40"><path d="M15 20c20-18 70-18 90 0" fill="none" stroke="#fff" stroke-width="3"/><path d="M98 11l10 9-12 6" fill="none" stroke="#fff" stroke-width="3"/><path d="M22 29L12 20l12-6" fill="none" stroke="#fff" stroke-width="3"/></svg></div><div class="zoomContainer"><div class="zoomWrapper"><div class="zoomLabel" id="zoomLabel">Zoom 50%</div><div class="zoomSliderContainer"><input type="range" min="1" max="100" value="50" class="zoomSlider" id="zoom"></div></div></div></div></div>`;document.querySelectorAll('.petSmallItem').forEach(el=>el.onclick=()=>{idx=+el.dataset.i;variation=0;render()});document.getElementById('prev').onclick=()=>{variation=(variation-1+p.variations)%p.variations;render()};document.getElementById('next').onclick=()=>{variation=(variation+1)%p.variations;render()};document.getElementById('purchase').onclick=paymentDialog;document.getElementById('zoom').oninput=e=>document.getElementById('zoomLabel').textContent='Zoom '+e.target.value+'%';let down=false,last=0;const rot=document.getElementById('rotate');rot.onmousedown=e=>{down=true;last=e.clientX;rot.style.cursor='grabbing'};window.onmouseup=()=>{down=false;rot.style.cursor='grab'};window.onmousemove=e=>{if(down&&Math.abs(e.clientX-last)>4){last=e.clientX;document.querySelector('.stagePet').style.transform=`translate(-50%,-50%) rotateY(${e.clientX%360}deg)`}}}function dialog(title,desc,body,buttons){document.body.insertAdjacentHTML('beforeend',`<div class="dialogContainer" id="dialog"><div class="dialog"><div class="title">${title}</div><div class="desc">${desc}</div>${body||''}<div class="buttonContainer">${buttons}</div></div></div>`)}function closeD(){document.getElementById('dialog')?.remove()}function paymentDialog(){dialog('Payment Method','How would you like to pay?','',`<div class="actionButton" onclick="choosePay('cash')">Cash</div><div class="actionButton" onclick="choosePay('card')">Card</div>`)}function choosePay(v){payment=v;closeD();nameDialog()}function nameDialog(){dialog('Pet Name','Enter pet name',`<input class="dialogInput" id="petName" placeholder="Name" autofocus>`,`<div class="actionButton" onclick="closeD()">Reject</div><div class="actionButton greenButton" onclick="confirmName()">Confirm</div>`)}function confirmName(){petName=document.getElementById('petName').value||'Name';closeD();dialog('Confirm Purchase','Are you sure you want to purchase this pet?','',`<div class="actionButton" onclick="closeD()">Reject</div><div class="actionButton redButton" onclick="finishBuy()">Confirm</div>`)}function finishBuy(){closeD();const p=pe
