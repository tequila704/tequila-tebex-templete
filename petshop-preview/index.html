<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tequila Pets — Shop Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;--bg:rgb(14,14,14);--bgT:rgba(14,14,14,1);--bg2:rgb(32,32,32);--bg3:rgb(55,55,55);--bg4:rgb(77,77,77);--textColor:white;--textColor2:rgb(200,200,200);user-select:none;background:radial-gradient(circle at 52% 47%,#353535 0,#1b1b1b 35%,#080808 78%)}
::-webkit-scrollbar{width:.25vw;height:.25vw}::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:.25vw}.shopContainer{width:100vw;height:100vh;display:flex;flex-direction:row;justify-content:center;overflow:hidden}.petsContainer{position:absolute;padding-left:.25vw;padding-right:.25vw;bottom:5vh;max-width:66vw;height:6vw;background-color:var(--bgT);border-radius:.75vw;overflow:hidden;display:flex;align-items:center}.petShopItems{display:flex;flex-direction:row;gap:.5vw;padding:.25vw;overflow-x:auto;align-items:center}.petSmallItem{min-width:5vw;min-height:5vw;width:5vw;height:5vw;display:flex;justify-content:center;align-items:center;border-radius:.75vw;transition:.2s;cursor:pointer;color:#777;text-align:center;font-size:.56vw;padding:.25vw}.petSmallItem:hover{background:var(--bg2)}.petGlyph{font-size:2vw;display:block;line-height:1.1}.infoContainer{position:absolute;top:5vw;left:5vw;width:20vw;gap:.5vw;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;background-color:var(--bgT);border-radius:1vw;padding:1vw}.petShopName{font-size:1.75vw;font-weight:600;color:var(--textColor);text-align:center}.petShopIcon{width:5vw;height:5vw;display:flex;align-items:center;justify-content:center;font-size:3.5vw}.purchase{background-color:var(--bg2);color:var(--textColor);font-size:1.25vw;padding:.75vw;border-radius:1vw;transition:.2s}.purchase:hover{cursor:pointer;background-color:var(--bg3)}.variationContainer{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:1vw}.variation{background-color:var(--bg2);color:var(--textColor);font-size:1.35vw;width:2.5vw;height:2.5vw;border-radius:.5vw;display:flex;align-items:center;justify-content:center;transition:.2s}.variation:hover{cursor:pointer;background-color:var(--bg3)}.variationNumber{font-size:1vw;color:var(--textColor);font-weight:600;text-align:center;width:1vw}.variationLabel{font-size:1.25vw;color:var(--textColor);text-align:center}.petDescription{font-size:.75vw;line-height:1.38;overflow-wrap:break-word;color:var(--textColor);max-height:12vw;overflow:auto}.petIconContainer{display:flex;flex-direction:row;align-items:center;justify-content:center;width:100%;gap:.7vw}.rotate{width:40vw;height:47.5vw;bottom:0;display:flex;align-items:center;justify-content:flex-end;flex-direction:column;cursor:grab}.rotateIcon{opacity:.82;margin-bottom:4vh;width:15%;height:7.5%;pointer-events:none}.zoomContainer{display:flex;height:100%;align-items:center;justify-content:center;position:absolute;right:5vw}.zoomWrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vw;width:min-content;padding:.5vw}.zoomSliderContainer{height:10vw;display:flex;align-items:center;justify-content:center}.zoomSlider{-webkit-appearance:none;outline:none;background-color:var(--bgT);transform:rotate(-90deg);padding:.25vw;border-radius:.5vw;width:10vw;height:.75vw}.zoomSlider::-webkit-slider-thumb{-webkit-appearance:none;border-radius:.75vw;width:1.75vw;height:1.75vw;background:var(--bg2);cursor:pointer}.zoomLabel{font-size:1vw;color:var(--textColor);padding:.5vw}.stagePet{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:25vw;height:25vw;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .12s}.stageGlyph{font-size:11vw;filter:drop-shadow(0 1.5vw 1.2vw #000);opacity:.88}.stageNote{position:absolute;left:50%;top:70%;transform:translateX(-50%);font-size:.62vw;color:#777;letter-spacing:.08em}.dialogContainer{position:fixed;inset:0;z-index:500;display:flex;justify-content:center;align-items:center;background:#000c}.dialog{background:var(--bg);border-radius:1vw;padding:1vw;display:flex;flex-direction:column;border:.075vw solid var(--bg3);gap:.35vw;min-width:25vw}.title{font-size:1.5vw;font-weight:600;color:white}.desc{font-size:1vw;margin-bottom:1vw;max-width:30vw;color:gray}.buttonContainer{display:flex;justify-content:flex-end;gap:.5vw;margin-top:.5vw}.actionButton{display:flex;justify-content:center;align-items:center;background:var(--bg2);color:white;font-size:1vw;padding:.75vw;border-radius:1vw;cursor:pointer;transition:.2s}.actionButton:hover{background:var(--bg3)}.greenButton{background:#38b1804d!important;color:#38b180!important}.redButton{background:#8f24244d!important;color:#ff3030!important}.dialogInput{border:0;background:var(--bg2);color:white;font-size:1vw;padding:.75vw;border-radius:1vw;outline:0;text-align:center}.previewTag{position:absolute;right:1vw;top:1vw;color:#777;font-size:.62vw;letter-spacing:.08em}.toast{position:fixed;top:1vw;left:50%;transform:translateX(-50%);background:#111;color:#ddd;border:1px solid #333;padding:.6vw 1vw;border-radius:.5vw;font-size:.75vw;display:none;z-index:1000}
</style>
</head>
<body>
<div id="app"></div><div class="previewTag">TEQUILA PETS • BROWSER SHOP PREVIEW</div><div class="toast" id="toast"></div>
<script>
const pets=[
['a_c_retriever','Retriever',400,1,1,4],['a_c_shepherdt','Shepherd',400,1,1,4],['bulldog','Frenchie',350,0,1,4],['yorkshire','Yorkie',350,0,1,4],['abdog','Bully',400,1,1,4],['ft-pitbull2','Pitbull',400,1,1,4],['a_c_rottweiler','Rottweiler',500,1,1,3],['a_c_pug','Pug',350,0,1,4],['a_c_husky','Husky',400,1,1,3],['a_c_poodle','Poodle',350,0,1,1],['a_c_westy','Westie',350,0,1,3],['a_c_shepherd','Shepard',400,1,1,3],['a_c_cat_01','Cat',400,0,0,3],['a_c_rabbit_01','Rabbit',250,0,0,3],['a_c_pig','Pig',250,0,0,1],['a_c_cow','Cow',250,0,0,1],['Younghorse','Young Horse',250,0,0,1],['Rangehorse','Range Horse',250,0,0,1],['Fullhorse','Full Breed Horse',250,0,0,1],['Donkey','Donkey',250,0,0,1],['a_c_rat','Rat',150,0,0,4],['a_c_boar','Boar',250,0,0,1],['a_c_hen','Hen',250,0,0,1],['a_c_deer','Deer',250,0,0,1],['a_c_chimp','Chimp',250,1,0,1],['a_c_rhesus','Ape',250,1,0,1],['a_c_mtlion','Lion',250,1,0,1],['a_c_armadillo','Armadillo',200,0,0,1],['chowchow','Chow Chow',450,1,1,1],['a_c_cockroach','Cockroach',50,0,0,1],['a_c_dalmatian','Dalmatian',450,1,1,1],['doberman','Doberman',500,1,1,1],['a_c_k9','K9',500,1,1,1],['robot_dog','Robot Dog',1000,1,1,1],['a_c_tarantula','Tarantula',150,0,0,1],['pitbull','Pitbull',400,1,1,1],['yorkie_puppy','Yorkie Puppy',300,0,1,1],['corsopuppy','corsopuppy',300,0,1,1],['cdev_cat_amer','American Cat',450,0,0,1],['cdev_cat_synphix','Sphynx Cat',500,0,0,1],['cdev_cat_turk','Turkish Cat',500,0,0,1],['cdev_cat_wcoon','Wild Coon Cat',500,0,0,1],['cdev_cat_wolf','Wolf Cat',550,0,0,1],['cdev_dog_bichon','Bichon',500,0,1,1],['cdev_dog_dalpup','Dalmatian Puppy',500,1,1,1],['cdev_dog_pup','Custom Puppy',500,1,1,1],['cdev_dog_shepup','Shepherd Puppy',550,1,1,1]
].map(x=>({model:x[0],label:x[1],price:x[2],attack:!!x[3],sniff:!!x[4],variations:x[5]}));
const desc={Retriever:'The Retriever is a friendly and versatile dog breed known for its intelligence and gentle nature. Renowned for retrieving skills, these dogs excel in hunting, service work, and family life.',Rottweiler:'The Rottweiler is a robust, loyal, and intelligent breed known for protective instincts and a strong build.',Pug:'The Pug is a small, charming dog breed with a distinctive wrinkled face and curled tail.',Husky:'The Husky is a medium-sized working dog known for its striking appearance, friendly demeanor, and endurance.',Poodle:'The Poodle is a highly intelligent and elegant dog breed known for its curly coat.',Westie:'The West Highland White Terrier is a small, confident dog known for its white coat and lively personality.',Shepard:'The German Shepherd is a large, strong and intelligent dog breed known for versatility and loyalty.',Cat:'The domestic cat is a small carnivorous mammal often valued for companionship and hunting vermin.',Rabbit:'Rabbits are charming small mammals with long ears, fluffy tails and a gentle demeanor.',Rat:'Rats are small intelligent rodents known for adaptability and sociable behavior.',Boar:'Boars are robust mammals known for their sturdy build, tusks and coarse fur.',Hen:'Hens are small to medium-sized birds known for their gentle nature and egg-laying ability.',Donkey:'Donkeys are sturdy sociable mammals known for strength, endurance and their distinctive bray.',Cow:'Cows are large gentle mammals commonly associated with agriculture and companionship.',Pig:'Pigs are intelligent sociable mammals known for their snouts, curly tails and foraging ability.',Lion:'The mountain lion is a large powerful wild cat known for strength, agility and stealth.',Chimp:'Chimpanzees are intelligent social primates known for expressive faces and tool-making ability.',Ape:'Rhesus macaques are intelligent adaptable primates known for agility and expressive behavior.',Deer:'Deer are graceful mammals known for slender builds, antlers and agility.'};
let idx=0,variation=0,payment='cash',petName='',rotation=0;const app=document.getElementById('app');
function glyph(p){if(p.model.includes('cat')||p.label.includes('Cat'))return'🐈';if(p.model.includes('horse')||p.model==='Donkey')return'🐎';if(['Pig','Cow','Boar','Hen','Rabbit','Rat','Deer','Chimp','Ape','Lion'].includes(p.label))return({Pig:'🐖',Cow:'🐄',Boar:'🐗',Hen:'🐔',Rabbit:'🐇',Rat:'🐀',Deer:'🦌',Chimp:'🐒',Ape:'🐒',Lion:'🦁'})[p.label];if(p.label==='Cockroach')return'🪳';if(p.label==='Tarantula')return'🕷️';if(p.label==='Armadillo')return'🐾';return'🐕'}
function ability(p){return p.sniff&&p.attack?'This pet can sniff and attack.':p.sniff?'This pet can sniff.':p.attack?'This pet can attack.':'This pet cannot sniff or attack.'}
function render(){const p=pets[idx];variation=Math.min(variation,p.variations-1);app.innerHTML=`<div class="shopContainer"><div class="stagePet" id="stage"><div class="stageGlyph">${glyph(p)}</div></div><div class="stageNote">IN FIVEM THE ACTUAL 3D PED IS RENDERED HERE</div><div class="petsContainer"><div class="petShopItems">${pets.map((x,i)=>`<div class="petSmallItem" data-i="${i}" style="background-color:${i===idx?'var(--bg3)':''}"><div><span class="petGlyph">${glyph(x)}</span>${x.label}</div></div>`).join('')}</div></div><div class="infoContainer"><div class="petIconContainer"><div class="petShopIcon">${glyph(p)}</div><div class="petShopName">${p.label}</div></div><p class="petDescription">${desc[p.label]||p.label}<br><br>${ability(p)}</p><div class="variationContainer"><div class="variationLabel">Variation</div><div class="variation" id="prev">‹</div><div class="variationNumber">${variation}</div><div class="variation" id="next">›</div></div><div class="purchase" id="purchase">Purchase (${p.price} €)</div></div><div class="rotate" id="rotate"><svg class="rotateIcon" viewBox="0 0 120 40"><path d="M15 20c20-18 70-18 90 0" fill="none" stroke="#fff" stroke-width="3"/><path d="M98 11l10 9-12 6" fill="none" stroke="#fff" stroke-width="3"/><path d="M22 29L12 20l12-6" fill="none" stroke="#fff" stroke-width="3"/></svg></div><div class="zoomContainer"><div class="zoomWrapper"><div class="zoomLabel" id="zoomLabel">Zoom 50%</div><div class="zoomSliderContainer"><input type="range" min="1" max="100" value="50" class="zoomSlider" id="zoom"></div></div></div></div>`;document.querySelectorAll('.petSmallItem').forEach(el=>el.onclick=()=>{idx=+el.dataset.i;variation=0;render()});document.getElementById('prev').onclick=()=>{variation=(variation-1+p.variations)%p.variations;render()};document.getElementById('next').onclick=()=>{variation=(variation+1)%p.variations;render()};document.getElementById('purchase').onclick=paymentDialog;document.getElementById('zoom').oninput=e=>{document.getElementById('zoomLabel').textContent='Zoom '+e.target.value+'%';document.querySelector('.stageGlyph').style.fontSize=(6+e.target.value/10)+'vw'};let down=false,last=0;const rot=document.getElementById('rotate');rot.onmousedown=e=>{down=true;last=e.clientX;rot.style.cursor='grabbing'};window.onmouseup=()=>{down=false;rot.style.cursor='grab'};window.onmousemove=e=>{if(down&&Math.abs(e.clientX-last)>4){rotation+=(e.clientX-last)/2;last=e.clientX;document.getElementById('stage').style.transform=`translate(-50%,-50%) rotateY(${rotation}deg)`}}}
function dialog(title,text,body,buttons){document.body.insertAdjacentHTML('beforeend',`<div class="dialogContainer" id="dialog"><div class="dialog"><div class="title">${title}</div><div class="desc">${text}</div>${body||''}<div class="buttonContainer">${buttons}</div></div></div>`)}function closeD(){document.getElementById('dialog')?.remove()}function paymentDialog(){dialog('Payment Method','How would you like to pay?','',`<div class="actionButton" onclick="choosePay('cash')">Cash</div><div class="actionButton" onclick="choosePay('card')">Card</div>`)}function choosePay(v){payment=v;closeD();dialog('Pet Name','Enter pet name',`<input class="dialogInput" id="petName" placeholder="Name" autofocus>`,`<div class="actionButton" onclick="closeD()">Reject</div><div class="actionButton greenButton" onclick="confirmName()">Confirm</div>`)}function confirmName(){petName=document.getElementById('petName').value||'Name';closeD();dialog('Confirm Purchase','Are you sure you want to purchase this pet?','',`<div class="actionButton" onclick="closeD()">Reject</div><div class="actionButton redButton" onclick="finishBuy()">Confirm</div>`)}function finishBuy(){closeD();const p=pets[idx],t=document.getElementById('toast');t.textContent=`Preview: ${petName} • ${p.label} • ${p.price}€ • ${payment}`;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}render();
</script>
</body>
</html>
