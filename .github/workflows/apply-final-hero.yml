name: Apply Final TEQUILA5M Hero

on:
  push:
    paths:
      - '.github/workflows/apply-final-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild hero and patch site
        run: python .github/scripts/apply_final_hero.py

      - name: Commit final hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tequila5m-hero-final.webp home.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use final TEQUILA5M hero artwork"
          git push
