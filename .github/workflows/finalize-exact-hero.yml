name: Finalize Exact TEQUILA5M Hero

on:
  push:
    paths:
      - '.github/workflows/finalize-exact-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact hero display patch
        run: python .github/scripts/finalize_exact_hero.py

      - name: Commit storefront patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show exact TEQUILA5M hero artwork on storefront"
          git push
