name: Rebuild Exact TEQUILA5M Hero 1000

on:
  push:
    paths:
      - '.github/workflows/rebuild-exact-hero-1000.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild exact hero
        run: python .github/scripts/rebuild_exact_hero_1000.py

      - name: Commit exact hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tequila5m-hero-new.webp home.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore exact TEQUILA5M hero artwork"
          git push
