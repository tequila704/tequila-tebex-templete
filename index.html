<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>TEQUILA5M | Premium FiveM Resources</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}#tequilaSite{display:block;width:100%;height:100dvh;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="tequilaSite" src="home.html" title="TEQUILA5M storefront"></iframe>
<script>
(() => {
  const frame = document.getElementById('tequilaSite');
  const drops = [
    {label:'DROP 01',video:'rAc7doNLnww',packages:[{label:'View Package',id:'7729280'}]},
    {label:'DROP 02',video:'b2zPZnqZXOM',packages:[{label:'View Package',id:'7108243'}]},
    {label:'MLO + SCRIPT',video:'QTFm-E0drFo',time:'23s',packages:[{label:'View MLO',id:'7498884'},{label:'View Script',id:'7510586'}]},
    {label:'DROP 04',video:'rKPf3houKrg',time:'29s',packages:[{label:'View Package',id:'7201139'}]},
    {label:'DROP 05',video:'taEsu7iMf2g',packages:[{label:'View Package',id:'7469409'}]},
    {label:'DROP 06',video:'B8mP3AFYn8w',packages:[{label:'View Package',id:'7617452'}]},
    {label:'DROP 07',video:'g46_jcurtKk',packages:[{label:'View Package',id:'7624933'}]},
    {label:'DROP 08',video:'UqImrRnT3Lc',packages:[{label:'View Package',id:'7689285'}]},
    {label:'DROP 09',video:'lnVvY7aEiNc',packages:[{label:'View Package',id:'7628579'}]},
    {label:'DROP 10',video:'H4m2jrB6kV8',packages:[{label:'View Package',id:'7666178'}]}
  ];

  function trailerUrl(drop){
    return `https://www.youtube.com/watch?v=${drop.video}${drop.time ? `&t=${drop.time}` : ''}`;
  }

  function inject(){
    const doc = frame.contentDocument;
    if(!doc || !doc.body || doc.getElementById('featured')) return;

    const style = doc.createElement('style');
    style.id = 'tequila-featured-styles';
    style.textContent = `
      .featured-drops{position:relative;isolation:isolate}
      .featured-drops:before{content:"";position:absolute;inset:20px -2vw auto;height:76%;pointer-events:none;z-index:-1;background:radial-gradient(circle at 15% 30%,rgba(255,60,174,.10),transparent 32%),radial-gradient(circle at 88% 40%,rgba(244,189,54,.10),transparent 34%)}
      .featured-drops .section-head{align-items:center}
      .featured-title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .featured-kicker{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(255,60,174,.07);border:1px solid rgba(255,60,174,.24);color:#ff82c9;font-size:.66rem;font-weight:1000;letter-spacing:.13em}
      .featured-count{color:var(--muted);font-size:.78rem;font-weight:800}
      .featured-rail{display:flex;gap:15px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 3px 17px;overscroll-behavior-inline:contain;scrollbar-width:thin;scrollbar-color:rgba(244,189,54,.45) transparent}
      .featured-rail::-webkit-scrollbar{height:7px}.featured-rail::-webkit-scrollbar-track{background:transparent}.featured-rail::-webkit-scrollbar-thumb{background:rgba(244,189,54,.38);border-radius:999px}
      .featured-drop-card{flex:0 0 min(380px,86vw);scroll-snap-align:start;overflow:hidden;border:1px solid rgba(244,189,54,.29);border-radius:21px;background:linear-gradient(180deg,rgba(24,24,27,.98),rgba(7,8,9,.98));box-shadow:0 16px 38px rgba(0,0,0,.38);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
      .featured-drop-card:hover{transform:translateY(-5px);border-color:rgba(244,189,54,.72);box-shadow:0 20px 48px rgba(0,0,0,.48),0 0 26px rgba(244,189,54,.10),0 0 18px rgba(255,60,174,.06)}
      .featured-media{display:block;position:relative;overflow:hidden;background:#090a0b}
      .featured-media img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transition:transform .28s ease}
      .featured-drop-card:hover .featured-media img{transform:scale(1.035)}
      .featured-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 48%,rgba(0,0,0,.78))}
      .featured-badge{position:absolute;left:13px;top:13px;z-index:2;padding:7px 9px;border-radius:999px;background:rgba(5,5,5,.82);border:1px solid rgba(244,189,54,.46);color:#ffd86b;font-size:.65rem;font-weight:1000;letter-spacing:.11em}
      .featured-play{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(244,189,54,.95);color:#211400;font-size:1.15rem;box-shadow:0 0 0 8px rgba(244,189,54,.11),0 13px 34px rgba(0,0,0,.42)}
      .featured-copy{padding:17px}
      .featured-copy small{display:block;color:#ff7bc5;font-weight:1000;letter-spacing:.13em;font-size:.63rem;margin-bottom:7px}
      .featured-copy h3{margin:0 0 6px;font-size:1.25rem;letter-spacing:-.02em}
      .featured-copy p{margin:0 0 12px;color:var(--muted);font-size:.83rem;line-height:1.5}
      .featured-packages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
      .featured-package{padding:5px 8px;border-radius:999px;background:#090a0b;border:1px solid rgba(244,189,54,.17);color:#d9cbaa;font-size:.65rem;font-weight:900}
      .featured-actions{display:flex;gap:7px;flex-wrap:wrap}
      .featured-actions .pill{flex:1;min-width:125px;border-radius:11px;padding:10px 11px;font-size:.78rem}
      .featured-watch{background:linear-gradient(180deg,#191219,#0f0d11)!important;border-color:rgba(255,60,174,.25)!important;color:#fff!important}
      .featured-full-link{white-space:nowrap}
      @media(max-width:680px){.featured-drops .section-head{align-items:flex-start}.featured-full-link{width:100%}.featured-drop-card{flex-basis:86vw}.featured-actions{flex-direction:column}.featured-actions .pill{width:100%}}
      @media(prefers-reduced-motion:reduce){.featured-drop-card,.featured-media img{transition:none!important}}
    `;
    doc.head.appendChild(style);

    const section = doc.createElement('section');
    section.id = 'featured';
    section.className = 'section shell featured-drops';
    section.setAttribute('aria-labelledby','featuredHeading');
    section.innerHTML = `
      <div class="section-head">
        <div>
          <div class="featured-title-row"><span class="featured-kicker">✦ REAL TEQUILA5M MEDIA</span><span class="featured-count">10 trailers • 11 matched packages</span></div>
          <h2 id="featuredHeading" style="margin-top:10px">Featured Drops</h2>
          <p>Watch the real trailer, then jump straight to the exact Tebex package you matched with it.</p>
        </div>
        <a class="pill dark featured-full-link" href="featured-drops.html">Open Full Showcase →</a>
      </div>
      <div class="featured-rail" aria-label="Featured TEQUILA5M drops">
        ${drops.map((drop,index) => {
          const video = trailerUrl(drop);
          const pkgTags = drop.packages.map(p => `<span class="featured-package">${p.label.replace('View ','')} #${p.id}</span>`).join('');
          const pkgButtons = drop.packages.map(p => `<a class="pill gold" href="https://tequila.tebex.io/package/${p.id}" target="_blank" rel="noopener">${p.label} ↗</a>`).join('');
          const title = drop.packages.length > 1 ? 'MLO + Script Feature' : `Featured Drop ${String(index+1).padStart(2,'0')}`;
          const copy = drop.packages.length > 1 ? 'One real trailer connected to both the MLO and script packages you selected.' : 'Real TEQUILA5M video media connected directly to its matched Tebex package.';
          const watchText = drop.time ? `▶ Watch @ ${drop.time}` : '▶ Watch Trailer';
          return `<article class="featured-drop-card">
            <a class="featured-media" href="${video}" target="_blank" rel="noopener" aria-label="Watch ${title} trailer">
              <img src="https://i.ytimg.com/vi/${drop.video}/hqdefault.jpg" alt="TEQUILA5M ${title} trailer thumbnail" loading="lazy">
              <span class="featured-badge">${drop.label}</span><span class="featured-play">▶</span>
            </a>
            <div class="featured-copy"><small>TEQUILA5M FEATURED</small><h3>${title}</h3><p>${copy}</p><div class="featured-packages">${pkgTags}</div><div class="featured-actions"><a class="pill dark featured-watch" href="${video}" target="_blank" rel="noopener">${watchText}</a>${pkgButtons}</div></div>
          </article>`;
        }).join('')}
      </div>`;

    const browse = doc.getElementById('browse');
    if(browse && browse.parentNode) browse.parentNode.insertBefore(section,browse);
    else doc.querySelector('main')?.appendChild(section);

    const nav = doc.getElementById('nav');
    if(nav && !doc.getElementById('featuredNavLink')){
      const link = doc.createElement('a');
      link.id = 'featuredNavLink';
      link.href = '#featured';
      link.textContent = 'Featured';
      const browseLink = [...nav.querySelectorAll('a')].find(a => a.getAttribute('href') === '#browse');
      if(browseLink) browseLink.insertAdjacentElement('afterend',link); else nav.prepend(link);
      link.addEventListener('click',()=>{nav.classList.remove('open');const menuBtn=doc.getElementById('menuBtn');if(menuBtn){menuBtn.setAttribute('aria-expanded','false');menuBtn.textContent='☰';}});
    }
  }

  frame.addEventListener('load', inject);
})();
</script>
</body>
</html>
